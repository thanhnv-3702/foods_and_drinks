<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/client :: layout(~{::title}, ~{::#client-content})}">
<head>
    <title>Notification Detail - Member Management</title>
</head>
<body>
<div id="client-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Chi tiết notification</h1>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/notifications}">Quay lại</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <h2 class="h5 mb-1" th:text="${notification.title}">Title</h2>
                    <div class="text-muted small">
                        <span th:text="${notification.type}">TEAM</span>
                        <span>·</span>
                        <span th:text="${notification.action}">UPDATE</span>
                        <span>·</span>
                        <span th:text="${#temporals.format(notification.createdAt, 'dd/MM/yyyy HH:mm')}">--/--</span>
                    </div>
                </div>
                <span class="badge" th:classappend="${notification.read} ? 'bg-secondary' : 'bg-danger'"
                      th:text="${notification.read} ? 'Đã đọc' : 'Chưa đọc'">Chưa đọc</span>
            </div>

            <div class="border rounded p-3 bg-light-subtle mb-3">
                <pre class="mb-0" style="white-space: pre-wrap;" th:text="${notification.content}">Content</pre>
            </div>

            <div class="d-flex gap-2">
                <form method="post" th:if="${!notification.read}" th:action="@{|/notifications/${notification.id}/read|}">
                    <button type="submit" class="btn btn-primary btn-sm">Đánh dấu đã đọc</button>
                </form>
                <form method="post" th:action="@{|/notifications/${notification.id}/delete|}"
                      onsubmit="return confirm('Bạn có chắc muốn xóa notification này?');">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Xóa</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
