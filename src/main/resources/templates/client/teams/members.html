<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/client :: layout(~{::title}, ~{::#client-content})}">
<head>
    <title>Thành viên team - Member Management</title>
</head>
<body>
<div id="client-content">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/teams}">Teams</a></li>
            <li class="breadcrumb-item"><a th:href="@{/teams/{id}(id=${team.id})}" th:text="${team.name}">Team</a></li>
            <li class="breadcrumb-item active">Thành viên</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Thành viên — <span th:text="${team.name}">Team</span></h1>
        <span class="text-muted small" th:text="|Tổng: ${members.totalElements} thành viên|">Tổng: 0</span>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Vị trí</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${members.content}">
                    <td>
                        <a th:href="@{/members/{id}(id=${m.id})}" class="text-decoration-none fw-semibold"
                           th:text="${m.name}">Name</a>
                    </td>
                    <td th:text="${m.email}">email</td>
                    <td th:text="${m.position != null ? m.position.name : '-'}">-</td>
                    <td class="text-end">
                        <a th:href="@{/members/{id}(id=${m.id})}" class="btn btn-outline-primary btn-sm">Xem profile</a>
                    </td>
                </tr>
                <tr th:if="${members.empty}">
                    <td colspan="4" class="text-center text-muted py-4">Team chưa có thành viên.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-center mt-4">
        <div th:replace="~{fragments/pagination :: pager(${members}, '/teams/' + ${team.id} + '/members')}"></div>
    </div>
</div>
</body>
</html>
