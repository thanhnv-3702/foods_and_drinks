<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/client :: layout(~{::title}, ~{::#client-content})}">
<head>
    <title th:text="#{page.team.members.client}">Team members - Member Management</title>
</head>
<body>
<div id="client-content">
    <nav th:attr="aria-label=#{aria.breadcrumb}">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/teams}" th:text="#{nav.teams}">Teams</a></li>
            <li class="breadcrumb-item"><a th:href="@{/teams/{id}(id=${team.id})}" th:text="${team.name}">Team</a></li>
            <li class="breadcrumb-item active" th:text="#{client.members.title}">Members</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0" th:text="#{client.members.pageTitle(${team.name})}">Members</h1>
        <span class="text-muted small" th:text="#{client.members.total(${members.totalElements})}">Total: 0</span>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th th:text="#{col.fullName}">Full name</th>
                    <th th:text="#{col.email}">Email</th>
                    <th th:text="#{col.position}">Position</th>
                    <th class="text-end" th:text="#{common.actions}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${members.content}">
                    <td>
                        <a th:href="@{/members/{id}(id=${m.id})}" class="text-decoration-none fw-semibold"
                           th:text="${m.name}">Name</a>
                    </td>
                    <td th:text="${m.email}">email</td>
                    <td th:text="${m.position != null ? m.position.name : #messages.msg('common.none')}">-</td>
                    <td class="text-end">
                        <a th:href="@{/members/{id}(id=${m.id})}" class="btn btn-outline-primary btn-sm" th:text="#{profile.viewProfile}">View profile</a>
                    </td>
                </tr>
                <tr th:if="${members.empty}">
                    <td colspan="4" class="text-center text-muted py-4" th:text="#{admin.empty.teamMembers}">Team has no members yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-center mt-4">
        <div th:replace="~{fragments/pagination :: pager(${members}, '/teams/' + ${team.id} + '/members')}"></div>
    </div>
</div>
</body>
</html>
