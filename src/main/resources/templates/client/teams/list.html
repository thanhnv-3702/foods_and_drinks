<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/client :: layout(~{::title}, ~{::#client-content})}">
<head>
    <title>Danh sách Teams - Member Management</title>
</head>
<body>
<div id="client-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Danh sách Teams</h1>
        <span class="text-muted small" th:text="|Tổng: ${teams.totalElements} team|">Tổng: 0</span>
    </div>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="t : ${teams.content}">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h5">
                        <a th:href="@{/teams/{id}(id=${t.id})}" class="text-decoration-none"
                           th:text="${t.name}">Team</a>
                    </h2>
                    <p class="text-muted small flex-grow-1"
                       th:text="${t.description != null and !t.description.isEmpty()} ? ${t.description} : 'Không có mô tả'">desc</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="small">
                            <span class="text-muted">Leader:</span>
                            <span th:text="${t.leader != null ? t.leader.name : 'Chưa có'}">-</span>
                        </span>
                        <span class="badge bg-primary rounded-pill"
                              th:text="|${memberCounts.containsKey(t.id) ? memberCounts.get(t.id) : 0} thành viên|">0</span>
                    </div>
                    <a th:href="@{/teams/{id}(id=${t.id})}" class="btn btn-outline-primary btn-sm mt-3">Xem thành viên</a>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${teams.empty}">
            <div class="alert alert-light text-center text-muted">Chưa có team nào.</div>
        </div>
    </div>

    <div class="d-flex justify-content-center mt-4">
        <div th:replace="~{fragments/pagination :: pager(${teams}, '/teams')}"></div>
    </div>
</div>
</body>
</html>
