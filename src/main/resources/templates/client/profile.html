<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/client :: layout(~{::title}, ~{::#client-content})}">
<head>
    <title th:text="#{page.profile.self}">My profile - Member Management</title>
</head>
<body>
<div id="client-content">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center">
                    <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center mb-3"
                         style="width: 80px; height: 80px; font-size: 2rem;"
                         th:text="${#strings.isEmpty(profile.name)} ? '?' : ${#strings.substring(profile.name,0,1)}">A</div>
                    <h2 class="h5 mb-1" th:text="${profile.name}">Name</h2>
                    <p class="text-muted small mb-2" th:text="${profile.email}">email</p>
                    <span class="badge"
                          th:classappend="${profile.role == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                          th:text="${profile.role}">ROLE</span>
                    <ul class="list-group list-group-flush mt-3 text-start">
                        <li class="list-group-item d-flex justify-content-between">
                            <span class="text-muted" th:text="#{profile.birthday}">Birthday</span>
                            <span th:text="${profile.birthday != null ? #temporals.format(profile.birthday, 'dd/MM/yyyy') : #messages.msg('common.none')}">-</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span class="text-muted" th:text="#{col.team}">Team</span>
                            <span th:text="${profile.teamName != null ? profile.teamName : #messages.msg('profile.noTeam')}">-</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between">
                            <span class="text-muted" th:text="#{col.position}">Position</span>
                            <span th:text="${profile.positionName != null ? profile.positionName : #messages.msg('common.notAssigned')}">-</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white fw-semibold" th:text="#{profile.projects}">Projects participated</div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                    <table class="table mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th th:text="#{col.project}">Project</th>
                            <th th:text="#{col.abbreviation}">Abbreviation</th>
                            <th th:text="#{col.team}">Team</th>
                            <th th:text="#{col.start}">Start</th>
                            <th th:text="#{col.end}">End</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${profile.projects}">
                            <td th:text="${p.name}">Project</td>
                            <td th:text="${p.abbreviation}">ABC</td>
                            <td th:text="${p.team != null ? p.team.name : #messages.msg('common.none')}">Team</td>
                            <td th:text="${p.startDate != null ? #temporals.format(p.startDate, 'dd/MM/yyyy') : #messages.msg('common.none')}">-</td>
                            <td th:text="${p.endDate != null ? #temporals.format(p.endDate, 'dd/MM/yyyy') : #messages.msg('common.none')}">-</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(profile.projects)}">
                            <td colspan="5" class="text-center text-muted py-3" th:text="#{profile.empty.projects}">No projects yet.</td>
                        </tr>
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-semibold" th:text="#{profile.skills}">Skills</div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(profile.skills)}" class="text-muted" th:text="#{profile.empty.skills}">No skills yet.</div>
                    <div class="d-flex flex-wrap gap-2">
                        <span th:each="s : ${profile.skills}" class="badge bg-light text-dark border p-2">
                            <span class="fw-semibold" th:text="${s.name}">Java</span>
                            <span class="text-muted" th:if="${s.level != null}" th:text="' · ' + ${s.level}"> · level</span>
                            <span class="text-muted" th:if="${s.usedYearNumber != null}"
                                  th:text="' · ' + #{profile.years(${s.usedYearNumber})}"> · years</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
