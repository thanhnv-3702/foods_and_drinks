<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.title}">Sign in - Member Management</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/techja-tokens.css}" rel="stylesheet">
    <link th:href="@{/css/techja-theme.css}" rel="stylesheet">
</head>
<body>
<div class="container-page d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="card border-0 shadow-sm w-100" style="max-width: 420px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <img th:src="@{/images/techja-icon.svg}" alt="" width="40" height="40" class="mb-3">
                <h1 class="h4 mb-1 fw-semibold" th:text="#{app.brand}">Member Management</h1>
                <p class="text-muted small mb-0" th:text="#{auth.subtitle}">Sign in to the system</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2" role="alert" th:text="#{auth.error.invalid}">
                Invalid email or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2" role="alert" th:text="#{auth.success.logout}">
                You have been signed out.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label" th:text="#{auth.email}">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" th:text="#{auth.password}">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" th:text="#{auth.submit}">Sign in</button>
            </form>

            <a th:href="@{/}" class="d-block text-center mt-3 small text-decoration-none" th:text="'&larr; ' + #{auth.backHome}">&larr; Back to home</a>
        </div>
    </div>
</div>
</body>
</html>
