<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Member Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px;">
    <div class="card border-0 shadow-sm mt-5">
        <div class="card-body p-4">
            <h1 class="h4 mb-1 text-center">Member Management</h1>
            <p class="text-muted text-center mb-4">Đăng nhập hệ thống</p>

            <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
                Email hoặc mật khẩu không đúng.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">
                Bạn đã đăng xuất.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
            </form>

            <a th:href="@{/}" class="d-block text-center mt-3 small text-decoration-none">&larr; Về trang chủ</a>
        </div>
    </div>
</div>
</body>
</html>
