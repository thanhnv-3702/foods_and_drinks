<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/client :: layout(~{::title}, ~{::#error-content})}">
<head>
    <title>404 - Not Found</title>
</head>
<body>
<div id="error-content">
    <div class="text-center py-5">
        <h1 class="display-4 fw-bold text-warning">404</h1>
        <p class="lead" th:text="${message} ?: 'Không tìm thấy nội dung bạn yêu cầu.'">Not found</p>
        <a th:href="@{/}" class="btn btn-outline-primary mt-2">Về trang chủ</a>
    </div>
</div>
</body>
</html>
