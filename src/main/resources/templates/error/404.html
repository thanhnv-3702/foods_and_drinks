<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/client :: layout(~{::title}, ~{::#error-content})}">
<head>
    <title th:text="|404 - #{error.404.title}|">404 - Not Found</title>
</head>
<body>
<div id="error-content">
    <div class="text-center py-5">
        <h1 class="display-4 fw-bold text-warning">404</h1>
        <p class="lead" th:text="${message} ?: #{error.404.message}">Not found</p>
        <a th:href="@{/}" class="btn btn-outline-primary mt-2" th:text="#{error.backHome}">Back to home</a>
    </div>
</div>
</body>
</html>
