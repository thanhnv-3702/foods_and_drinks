<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/client :: layout(~{::title}, ~{::#error-content})}">
<head>
    <title th:text="|403 - #{error.403.title}|">403 - Access Denied</title>
</head>
<body>
<div id="error-content">
    <div class="text-center py-5">
        <h1 class="display-4 fw-bold text-danger">403</h1>
        <p class="lead" th:text="#{error.403.message}">You do not have permission to access this page.</p>
        <a th:href="@{/}" class="btn btn-outline-primary mt-2" th:text="#{error.backHome}">Back to home</a>
    </div>
</div>
</body>
</html>
