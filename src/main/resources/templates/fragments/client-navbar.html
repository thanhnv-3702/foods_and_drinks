<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="navbar">
<body>
<nav class="navbar navbar-expand-lg techja-navbar">
    <div class="container-page">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <img th:src="@{/images/techja-icon.svg}" alt="" width="28" height="28" class="me-2">
            Member Management
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#clientNavbar"
                aria-controls="clientNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="clientNavbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"
                       th:classappend="${activeMenu == 'home'} ? ' active' : ''">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/teams}"
                       th:classappend="${activeMenu == 'teams'} ? ' active' : ''">Teams</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/profile}"
                       th:classappend="${activeMenu == 'profile'} ? ' active' : ''">Profile</a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-lg-center gap-lg-1">
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}">Admin</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-primary btn-sm ms-lg-2" th:href="@{/login}">Sign in</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">
                        <span sec:authentication="principal.displayName">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end border">
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-2 py-1">
                                <button type="submit" class="btn btn-sm btn-outline-danger w-100">Sign out</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
