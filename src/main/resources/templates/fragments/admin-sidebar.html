<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar">
<body>
<aside class="admin-sidebar d-flex flex-column flex-shrink-0 p-3">
  <a th:href="@{/admin}" class="d-flex align-items-center gap-2 mb-3 text-decoration-none">
    <img th:src="@{/images/techja-icon.svg}" alt="" class="brand-logo" width="28" height="28">
    <span class="brand-title fs-5">Admin Panel</span>
  </a>
  <hr>
  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item">
      <a th:href="@{/admin}" class="nav-link"
         th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''">
        Dashboard
      </a>
    </li>
    <li>
      <a th:href="@{/admin/users}" class="nav-link"
         th:classappend="${activeMenu == 'users'} ? 'active' : ''">Users</a>
    </li>
    <li>
      <a th:href="@{/admin/teams}" class="nav-link"
         th:classappend="${activeMenu == 'teams'} ? 'active' : ''">Teams</a>
    </li>
    <li>
      <a th:href="@{/admin/positions}" class="nav-link"
         th:classappend="${activeMenu == 'positions'} ? 'active' : ''">Positions</a>
    </li>
    <li>
      <a th:href="@{/admin/projects}" class="nav-link"
         th:classappend="${activeMenu == 'projects'} ? 'active' : ''">Projects</a>
    </li>
    <li>
      <a th:href="@{/admin/skills}" class="nav-link"
         th:classappend="${activeMenu == 'skills'} ? 'active' : ''">Skills</a>
    </li>
    <li>
      <a th:href="@{/admin/activity-logs}" class="nav-link"
         th:classappend="${activeMenu == 'activity-logs'} ? 'active' : ''">Activity Logs</a>
    </li>
  </ul>
  <hr>
  <div>
    <a th:href="@{/}" class="back-link text-decoration-none">&larr; Back to client</a>
  </div>
</aside>
</body>
</html>
