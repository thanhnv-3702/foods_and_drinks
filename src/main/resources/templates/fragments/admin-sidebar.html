<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar">
<body>
<aside class="admin-sidebar d-flex flex-column flex-shrink-0 p-3">
  <a th:href="@{/admin}" class="d-flex align-items-center gap-2 mb-3 text-decoration-none">
    <img th:src="@{/images/techja-icon.svg}" alt="" class="brand-logo" width="28" height="28">
    <span class="brand-title fs-5" th:text="#{nav.adminPanel}">Admin Panel</span>
  </a>
  <hr>
  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item">
      <a th:href="@{/admin}" class="nav-link"
         th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''"
         th:text="#{page.dashboard}">Dashboard</a>
    </li>
    <li>
      <a th:href="@{/admin/users}" class="nav-link"
         th:classappend="${activeMenu == 'users'} ? 'active' : ''" th:text="#{page.users}">Users</a>
    </li>
    <li>
      <a th:href="@{/admin/teams}" class="nav-link"
         th:classappend="${activeMenu == 'teams'} ? 'active' : ''" th:text="#{page.teams}">Teams</a>
    </li>
    <li>
      <a th:href="@{/admin/positions}" class="nav-link"
         th:classappend="${activeMenu == 'positions'} ? 'active' : ''" th:text="#{page.positions}">Positions</a>
    </li>
    <li>
      <a th:href="@{/admin/projects}" class="nav-link"
         th:classappend="${activeMenu == 'projects'} ? 'active' : ''" th:text="#{page.projects}">Projects</a>
    </li>
    <li>
      <a th:href="@{/admin/skills}" class="nav-link"
         th:classappend="${activeMenu == 'skills'} ? 'active' : ''" th:text="#{page.skills}">Skills</a>
    </li>
    <li>
      <a th:href="@{/admin/activity-logs}" class="nav-link"
         th:classappend="${activeMenu == 'activity-logs'} ? 'active' : ''" th:text="#{page.activityLogs}">Activity Logs</a>
    </li>
    <li>
      <a th:href="@{/admin/import}" class="nav-link text-white"
         th:classappend="${activeMenu == 'import'} ? 'active' : 'link-dark'" th:text="#{page.import}">Import CSV</a>
    </li>
  </ul>
  <hr>
  <div>
    <a th:href="@{/}" class="back-link text-decoration-none" th:text="'&larr; ' + #{nav.backToClient}">&larr; Back to client</a>
  </div>
</aside>
</body>
</html>
