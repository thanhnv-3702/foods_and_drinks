<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Fragment phân trang dùng chung cho admin.
  Tham số: page (Spring Data Page), baseUrl (đường dẫn list).
-->
<nav th:fragment="pager(page, baseUrl)" th:if="${page.totalPages > 1}" aria-label="Pagination">
    <ul class="pagination pagination-sm mb-0">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.number - 1}, size=${page.size})}">&laquo;</a>
        </li>
        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="@{${baseUrl}(page=${i}, size=${page.size})}" th:text="${i + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.number + 1}, size=${page.size})}">&raquo;</a>
        </li>
    </ul>
</nav>
</body>
</html>
