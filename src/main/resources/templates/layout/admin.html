<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Admin</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/techja-tokens.css}" rel="stylesheet">
    <link th:href="@{/css/techja-theme.css}" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body class="admin-body">
<div class="d-flex admin-wrapper">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="admin-content flex-grow-1 d-flex flex-column min-vh-100">
        <header class="admin-topbar px-4 py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h5 mb-0" th:text="${pageTitle} ?: 'Admin'">Admin</h1>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-muted small">
                        <span sec:authentication="principal.displayName">Admin</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Sign out</button>
                    </form>
                </div>
            </div>
        </header>
        <main class="flex-grow-1 p-4" th:insert="${content}"></main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
