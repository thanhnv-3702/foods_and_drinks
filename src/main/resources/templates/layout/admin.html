<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body class="admin-body">
<div class="d-flex admin-wrapper">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
    <div class="admin-content flex-grow-1 d-flex flex-column min-vh-100">
        <header class="admin-topbar bg-white border-bottom px-4 py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h5 mb-0 text-secondary" th:text="${pageTitle} ?: 'Admin'">Admin</h1>
                <span class="badge text-bg-secondary">Admin namespace</span>
            </div>
        </header>
        <main class="flex-grow-1 p-4" th:insert="${content}"></main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
