<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Member Management</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/techja-tokens.css}" rel="stylesheet">
    <link th:href="@{/css/techja-theme.css}" rel="stylesheet">
    <link th:href="@{/css/client.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/client-navbar :: navbar}"></header>
<main class="flex-grow-1 container py-4">
    <div th:replace="~{fragments/flash :: flash}"></div>
    <div th:insert="${content}"></div>
</main>
<footer th:replace="~{fragments/client-footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
