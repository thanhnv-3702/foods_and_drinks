<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::#admin-content})}">
<head>
    <title>Activity Logs - Admin</title>
</head>
<body>
<div id="admin-content">
    <div th:replace="~{fragments/flash :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Nhật ký hoạt động</h2>
        <form th:action="@{/admin/activity-logs/clear}" method="post"
              onsubmit="return confirm('Xóa toàn bộ nhật ký?');" th:if="${!logs.empty}">
            <button type="submit" class="btn btn-outline-danger btn-sm">Xóa tất cả</button>
        </form>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width: 70px;">ID</th>
                    <th style="width: 170px;">Thời gian</th>
                    <th style="width: 160px;">Hành động</th>
                    <th>Mô tả</th>
                    <th>Người thực hiện</th>
                    <th style="width: 90px;" class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs.content}">
                    <td th:text="${log.id}">1</td>
                    <td th:text="${#temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm:ss')}">--</td>
                    <td><span class="badge bg-secondary" th:text="${log.action}">ACTION</span></td>
                    <td th:text="${log.description}">desc</td>
                    <td th:text="${log.user != null ? log.user.name : 'Hệ thống'}">user</td>
                    <td class="text-end">
                        <form th:action="@{/admin/activity-logs/{id}/delete(id=${log.id})}" method="post"
                              onsubmit="return confirm('Xóa log này?');">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${logs.empty}">
                    <td colspan="6" class="text-center text-muted py-4">Chưa có log nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="text-muted small" th:text="|Tổng: ${logs.totalElements} log|">Tổng: 0</span>
        <div th:replace="~{fragments/pagination :: pager(${logs}, '/admin/activity-logs')}"></div>
    </div>
</div>
</body>
</html>
