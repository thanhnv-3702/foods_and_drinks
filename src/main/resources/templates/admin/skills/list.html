<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::#admin-content})}">
<head>
    <title>Skills - Admin</title>
</head>
<body>
<div id="admin-content">
    <div th:replace="~{fragments/flash :: flash}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Danh sách Skills</h2>
        <div class="d-flex gap-2">
            <a th:href="@{/admin/export/skills.csv}" class="btn btn-outline-success btn-sm">Export CSV</a>
            <a th:href="@{/admin/skills/new}" class="btn btn-primary btn-sm">+ Thêm Skill</a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width: 70px;">ID</th>
                    <th>Tên kỹ năng</th>
                    <th>Mức độ</th>
                    <th>Số năm</th>
                    <th>Người sở hữu</th>
                    <th style="width: 160px;" class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${skills.content}">
                    <td th:text="${s.id}">1</td>
                    <td th:text="${s.name}">Java</td>
                    <td th:text="${s.level}">Advanced</td>
                    <td th:text="${s.usedYearNumber}">3</td>
                    <td th:text="${s.user != null ? s.user.name : '-'}">User</td>
                    <td class="text-end">
                        <a th:href="@{/admin/skills/{id}/edit(id=${s.id})}"
                           class="btn btn-outline-secondary btn-sm">Sửa</a>
                        <form th:action="@{/admin/skills/{id}/delete(id=${s.id})}" method="post"
                              class="d-inline" onsubmit="return confirm('Xóa kỹ năng này?');">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${skills.empty}">
                    <td colspan="6" class="text-center text-muted py-4">Chưa có kỹ năng nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="text-muted small" th:text="|Tổng: ${skills.totalElements} kỹ năng|">Tổng: 0</span>
        <div th:replace="~{fragments/pagination :: pager(${skills}, '/admin/skills')}"></div>
    </div>
</div>
</body>
</html>
